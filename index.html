<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Graph Giraffe</title>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="/icons/logo.svg" type="image/x-icon" />

    <script type="module">
      import {
        NodeEditor,
        shaders,
        generateTetureSkinOption,
      } from "./dist/graph-giraffe.js";

      import { TextureSelect } from "./dist/components/texture-select.js";
      import { GGPropGroup } from "./dist/components/prop-group.js";
      import { ActionPane } from "./dist/components/action-pane.js";
      import { HistoryPane } from "./dist/components/history-pane.js";
      import { LoadingScreen } from "./dist/components/loading-screen.js";
      import { CustomSelect } from "./dist/components/select.js";
      import { SelectionToolbar } from "./dist/components/selection-toolbar.js";
      import { UIControls as UIControlElement } from "./dist/components/ui-controls.js";

      async function init() {
        await document.fonts.ready;

        const editor = await NodeEditor.create(
          "webgl-canvas",
          "2d-bg-canvas",
          shaders.vertexShader,
          shaders.fragmentShader,
          shaders.bgVertexShader,
          shaders.bgFragmentShader,
          shaders.msdfVertexShader,
          shaders.msdfFragmentShader,
          shaders.iconBGVertexShader,
          shaders.iconBGFragmentShader,
          { connectionMode: "node" },
          [
            generateTetureSkinOption(
              "node-head",
              "Custom Node Head",
              0,
              "jkldfjsljfsdlfjlsdjlfjsl"
            ),
            generateTetureSkinOption(
              "node-head",
              "Node Head Marble",
              1,
              "jkldfjslllsljfsdlfjlsdjlfjsl"
            ),
            generateTetureSkinOption(
              "node-head",
              "Node Head Glassy",
              2,
              "jkldfjslllsljfsdlfjlsdjlfjslfsljklsd"
            ),
            generateTetureSkinOption(
              "node-body",
              "Custom Node Body",
              0,
              "jkldfkldfdfjsljfsdlfjlsdjlfjsl"
            ),
            generateTetureSkinOption(
              "node-body",
              "Node Body Marble",
              1,
              "jklcfkldfdfjsljfsdlfjlsdjlfjsl"
            ),
            generateTetureSkinOption(
              "node-body",
              "Node Body Glassy",
              2,
              "jklbfkldfdfjsljfsdlfjlsdjlfjsl"
            ),
            generateTetureSkinOption(
              "node-body",
              "Node Body Solid",
              3,
              "jklafkldfdfjsljfsdlfjlsdjlfjsl"
            ),
            generateTetureSkinOption(
              "group-body",
              "Group Body Glassy",
              0,
              "jklajkffkldfdfjsljfjklfdsdlfjlsdjlfjsl"
            ),
            generateTetureSkinOption(
              "group-head",
              "Group Head Glassy",
              0,
              "jklajkffkldfdfjsljfjklfdsdlfjlsiifjsl"
            ),
            generateTetureSkinOption(
              "group-head",
              "Group Head Blank",
              1,
              "jklajjlfldfkffkldfdfjsljfjklfdsdlfjlsiifjsl"
            ),
          ]
        );

        editor.debug = true;
        editor.render();
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </head>
  <body>
    <!-- WebGL Canvas -->
    <canvas id="2d-bg-canvas"></canvas>
    <canvas id="webgl-canvas"></canvas>

    <!-- Hidden 2D Canvas for Text to Texture generation -->
    <canvas id="2d-text-canvas" class="hidden"></canvas>

    <!-- Overlay 2D Canvas for crisp floating labels -->
    <canvas
      id="2d-label-canvas"
      style="pointer-events: none; z-index: 5"
    ></canvas>

    <!-- Screen Reader Only Node List -->
    <ul
      id="sr-node-list"
      class="sr-only"
      aria-label="Workflow graph nodes"
      role="list"
    ></ul>

    <!-- History Pane -->
    <gg-history-pane id="undo-redo-wrapper"></gg-history-pane>

    <!-- Sidebar Overlay -->
    <gg-ui-controls
      id="sidebar"
      class="sidebar collapsed"
      part="gg-ui-control-host"
    >
    </gg-ui-controls>

    <!-- Action Pane -->
    <gg-action-pane id="tool-panel"></gg-action-pane>

    <gg-loading-screen></gg-loading-screen>
  </body>
</html>
